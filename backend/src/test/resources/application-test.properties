# H2 Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Database Initialization
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none

# Standard Spring Mail Configuration Mock
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=mock-user
spring.mail.password=mock-pass

# App custom settings
app.stripe.secret-key=sk_test_mock
app.stripe.webhook-secret=whsec_mock

app.google.oauth.client-id=test-google-client-id.apps.googleusercontent.com
app.google.oauth.hosted-domain=
app.google.sheets.credentials-json={}
app.google.sheets.spreadsheet-id=mock_sheet_id

app.gmail.credentials-json={"installed":{"client_id":"mock-id","client_secret":"mock-secret"}}
app.gmail.refresh-token=mock-refresh-token

app.app.pickup-code.threshold=30.0
app.app.default-config.currency=ron
app.app.frontend.success-url=https://example.org/donation-success
app.app.frontend.cancel-url=https://example.org/donation-cancelled

app.charity.email.from=noreply@example.org
app.charity.email.subject.pickup-code=Causeway - Your Pickup Code
app.jwt.secret=test_jwt_secret_key_that_is_long_enough_for_hmac_sha256
app.jwt.expiration-hours=8
