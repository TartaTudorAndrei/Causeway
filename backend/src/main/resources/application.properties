server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
server.forward-headers-strategy=framework
server.error.include-message=always
server.error.include-binding-errors=always

# Jackson Configuration
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:charity_db}?sslmode=${PGSSLMODE:disable}&currentSchema=public,donations,auth,finance,logistics,hr,fundraising,marketing,general,legal
spring.datasource.username=${PGUSER:charity_user}
spring.datasource.password=${PGPASSWORD:charity_password}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.schema=public

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.schemas=public,auth,general,hr,logistics,donations,finance,fundraising,legal,communication,projects
spring.flyway.default-schema=public
spring.flyway.create-schemas=true
spring.flyway.validate-on-migrate=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Database initialization
spring.sql.init.mode=never
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Standard Spring Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Timeout Settings (prevents hanging)
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Additional Gmail-specific settings
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8

